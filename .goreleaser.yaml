# GoReleaser builds hmon for macOS and Linux on every tag, publishes a GitHub
# release, and updates the Homebrew formula in Sousf/homebrew-tap.
#
# Release process is: git tag vX.Y.Z && git push --tags
version: 2

project_name: hmon

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: hmon
    main: ./cmd/hmon
    binary: hmon
    env:
      # Pure Go with no cgo, which is what makes cross-compiling to four
      # targets from one runner free.
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: hmon
    ids: [hmon]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: checksums.txt

# A formula rather than a cask, deliberately. GoReleaser marks `brews` as
# deprecated because Homebrew wants prebuilt binaries shipped as casks, but
# casks are macOS-only — and this tool watches Linux machines, so being
# installable on a Linux workstation matters more here than following that
# convention. Formulae also avoid the Gatekeeper quarantine that casks have to
# strip explicitly.
#
# Only one of the two can exist under a given name: Homebrew resolves an
# ambiguous name to the formula and ignores the cask, so shipping both would
# leave the cask uninstallable.
brews:
  - name: hmon
    ids: [hmon]
    repository:
      owner: Sousf
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key rather than a token. The workflow's
      # built-in GITHUB_TOKEN cannot reach another repo, and a classic PAT
      # would grant read/write to every repo on the account. This key can
      # write to homebrew-tap and nothing else, and carries no API access.
      git:
        url: git@github.com:Sousf/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY_PATH }}"
    directory: Formula
    homepage: https://github.com/Sousf/hmon
    description: Terminal dashboard for a small fleet of Linux machines over SSH
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    install: |
      bin.install "hmon"
    test: |
      # -example needs no config, no network, and no TTY, so it is the only
      # command that can meaningfully run under `brew test`.
      assert_match "hosts:", shell_output("#{bin}/hmon -example")
    caveats: |
      hmon reads ~/.config/hmon/config.yaml. Create a starter one with:

        mkdir -p ~/.config/hmon
        hmon -example > ~/.config/hmon/config.yaml

      Connection details come from ~/.ssh/config, so each host is usually
      just its alias.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: |
    ## Install

    ```sh
    brew install Sousf/tap/hmon
    ```
